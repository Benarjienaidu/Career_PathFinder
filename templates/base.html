
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Career Pathfinder{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</head>
<body>
    
  <header class="navbar">
    <a class="logo" href="{{ url_for('home') }}">Career Pathfinder</a>

    <nav>
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('assessment') }}">Assessment</a>
        <a href="{{ url_for('careers') }}">Careers</a>
        <a href="{{ url_for('roadmap') }}">Roadmap</a>
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('register') }}">Register</a>
        <a href="{{ url_for('login') }}">Login</a>
    </nav>
  </header>


    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>Discover your strengths. Build your future.</p>
    </footer>
</body>
</html>
